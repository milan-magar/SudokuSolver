<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sudoku</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: row;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            gap: 40px;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 24px;
        }

        p {
            line-height: 1.5;
            color: #4b5563;
        }

        /* Sudoku Grid Styles */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 40px);
            grid-template-rows: repeat(9, 40px);
            border: 3px solid #111827;
            background-color: #111827;
            gap: 1px;
        }

        .cell {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            border: none;
            text-align: center;
            outline: none;
            cursor: pointer;
        }

        /* Thick borders for 3x3 subgrids */
        .cell:nth-child(3n) {
            border-right: 2px solid #111827;
        }
        
        .cell:nth-nth(9n) {
            border-right: none;
        }

        /* Row 3 and 6 bottom borders */
        .row-border-bottom {
            border-bottom: 2px solid #111827;
        }

        .cell:focus {
            background-color: #e0e7ff;
        }

        .cell.given {
            background-color: #f9fafb;
            color: #111827;
            cursor: default;
        }

        .cell.user-input {
            color: var(--primary-color);
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Side: Sudoku Board -->
        <div class="left-panel">
            <div id="sudoku-board" class="sudoku-grid"></div>
            <div class="btn-container">
                <button onclick="checkPuzzle()">Check Solution</button>
                <button onclick="resetPuzzle()">Reset</button>
            </div>
        </div>

        <!-- Right Side: Info & Controls -->
        <div class="right-panel">
            <h1>Playable Sudoku</h1>
            <p>Welcome to this interactive Sudoku mini-app! Click on any empty white cell on the left and type a number from <strong>1 to 9</strong>.</p>
            <p>The dark bold lines segment the board into standard 3x3 subgrids. Pre-filled numbers cannot be changed.</p>
            <p id="status-message" style="font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <script>
        // Initial solvable Sudoku board (0 represents empty cells)
        const initialBoard = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        const boardElement = document.getElementById('sudoku-board');

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.className = 'cell';

                    // Add 3x3 block styling boundaries
                    if (r === 2 || r === 5) {
                        input.style.borderBottom = '2px solid #111827';
                    }
                    if (c === 2 || c === 5) {
                        input.style.borderRight = '2px solid #111827';
                    }

                    const val = initialBoard[r][c];
                    if (val !== 0) {
                        input.value = val;
                        input.disabled = true;
                        input.classList.add('given');
                    } else {
                        input.classList.add('user-input');
                        input.dataset.row = r;
                        input.dataset.col = c;
                        
                        input.addEventListener('input', (e) => {
                            const val = e.target.value;
                            if (!/^[1-9]$/.test(val)) {
                                e.target.value = '';
                            }
                        });
                    }

                    boardElement.appendChild(input);
                }
            }
        }

        function resetPuzzle() {
            renderBoard();
            document.getElementById('status-message').textContent = '';
        }

        function checkPuzzle() {
            const inputs = boardElement.getElementsByTagName('input');
            let isComplete = true;
            let currentBoard = [];

            let index = 0;
            for (let r = 0; r < 9; r++) {
                let row = [];
                for (let c = 0; c < 9; c++) {
                    const val = inputs[index].value;
                    if (val === '') isComplete = false;
                    row.push(val ? parseInt(val) : 0);
                    index++;
                }
                currentBoard.push(row);
            }

            const statusEl = document.getElementById('status-message');
            if (!isComplete) {
                statusEl.style.color = '#d97706';
                statusEl.textContent = 'The puzzle is not complete yet!';
                return;
            }

            // Simple validation check for rows/cols/subgrids can go here, 
            // for now, we give a success prompt if filled.
            statusEl.style.color = '#059669';
            statusEl.textContent = 'Great job! Puzzle filled successfully.';
        }

        // Initialize on load
        renderBoard();
    </script>
</body>
</html>
